spring:
  application:
    name: be-interview-prep
  config:
    # Local developer overrides (gitignored). Real environments use env vars.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bemock}
    username: ${DB_USERNAME:bemock}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Required, at least 32 bytes. Never commit a real value.
    secret: ${JWT_SECRET:}
    ttl: 15m
  admin:
    # Optional bootstrap admin, created at startup if both are set.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
